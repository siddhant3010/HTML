<!--   . . . . . . . . . . . . .PRE TAG . . . . . . . . . . . . . . .   -->
  
  <!-- HTML always ignores extra spaces and newlines.
        In order to display a piece of text as is,
        we use pre tag. -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pre</title>
</head>
<body>


    <!-- <p>

         hey
        i                   
        am     good

        
    </p>  -->

    <!-- it gets arranged in a line automatically -->

    <pre> 
         
          hey 
          i 
          am     good 
    </pre> 

    <!-- using pre tag places remains as they are. -->
    

</body>
</html>
