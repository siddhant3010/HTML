<!--  . . . . . . . . . . . . .ANCHOR TAG . . . . . . . . . . . .  -->
  <!-- The anchor tag is used to add links to an exesting content inside an HTML page. -->

  <!-- EXAMPLE:  -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anchor</title>
</head>
<body>
    
    If you want to go to google,<a href="https://google.com">click here</a>

       <!-- Here href adds web address to text "click here" -->
     <!-- ( <a> <!a> ) anchor tag ,we can either use single or double quote in attributes.  -->

     
</body>
</html>
