<!--  . . . . . . . . . . . . BIG AND SMALL TAG . . . . . . . . . . . . . .  -->
<!-- We can make a text bigger <big> , smaller ,<small> with tags. -->

<!-- EXAMPLE: -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Big Small</title>
  </head>
  <body>
    <big> Hello world</big>
    <small> Hello world </small>
  </body>
</html>
