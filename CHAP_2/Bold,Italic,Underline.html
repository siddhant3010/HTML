<!-- . . . . . . . . . . . .  .  . .BOLD,ITALIC,UNDERLINE TAGS . . . . . . . . . . . . .  -->
     <!-- we can use bold,italic and underline tags to highlight the text as follows: -->

            <!--    <b> This is bold </b>  -->
            <!--    <i> This is italic </i>    -->
            <!--    <u> This is underline  </u>     -->

     <!-- usually this is done by adding <styles> css ,but it can also be done by HTML.  -->
 
        
<!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width= , initial-scale=1.0">
    <title>Bold italic and underline</title>
 </head>
 <body>
     
           <b> This is bold </b>  
           <i> This is italic </i>    
            <u> This is underline  </u>    

 </body>
 </html>
