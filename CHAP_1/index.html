<!--  . . . . . Creating our first website . . . . .  -->
  <!-- We start building a website by creating a file named "index.html".
      index.html is a special filename which is presented when the website root address is typed. -->


<!DOCTYPE html>      <!-- Specifies this is an html 5 document. -->

<html lang="en">     <!-- Root of an html page. -->

<head>        <!--  Contains page metadata.  -->   
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Document</title>     <!--  Contains title.  -->

</head>

<body>                 <!--  The main body of the page (rendered by the browser).  -->
        
      Hello world this is my first website
    <!--  ANYTHING INSIDE THE BODY IS THE VISIBLE PART OF THE PAGE  -->
  
</body>       <!-- Closing body tag. -->

</html> 



<!-- . . . . . . . . .  IMPORTANT NOTES . . . . . . . . . .  -->
 <!--  (.) <head> & <body> tags are children of html tag.
       (.) HTML is the parent of <head> & <body> tag.
       (.) Some html tags have no content. These are called Empty elements e.g.<br> .
       (.) Most of the HTML elements have opening &closing tag with content in between opening & closing tag. 
       (.) We can either use.htm or .html extension.
       (.) You can use "inspect element" or " view page source" option from chrome to look into a website's HTML code. -->


<!--  COMMENTS IN HTML :- comments in HTML are used to mark text which should not be parsed.They can help document the source code.  -->

<!-- CASE SENSITIVITY :- HTML is a case insensitive language.<H1> and <h1> tags are the same. -->
