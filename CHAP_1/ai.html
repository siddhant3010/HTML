<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Useful Links Website</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    header {
      background: #333;
      color: white;
      padding: 20px;
    }

    h1 {
      margin: 0;
    }

    .container {
      padding: 40px 20px;
    }

    .link-box {
      background: white;
      margin: 15px auto;
      padding: 20px;
      width: 300px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: 0.3s;
    }

    .link-box:hover {
      transform: scale(1.05);
    }

    a {
      text-decoration: none;
      font-size: 20px;
      color: #0077cc;
      font-weight: bold;
    }

    footer {
      background: #222;
      color: white;
      padding: 10px;
      margin-top: 40px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Useful Websites</h1>
    <p>Quick access to popular platforms</p>
  </header>

  <div class="container">

    <div class="link-box">
      <a href="https://www.youtube.com" target="_blank">
        YouTube
      </a>
    </div>

    <div class="link-box">
      <a href="https://www.facebook.com" target="_blank">
        Facebook
      </a>
    </div>

    <div class="link-box">
      <a href="https://www.instagram.com" target="_blank">
        Instagram
      </a>
    </div>

    <div class="link-box">
      <a href="https://www.github.com" target="_blank">
        GitHub
      </a>
    </div>

    <div class="link-box">
      <a href="https://www.google.com" target="_blank">
        Google
      </a>
    </div>

  </div>

  <footer>
    <p>© 2026 My Basic Website</p>
  </footer>

</body>
</html>
