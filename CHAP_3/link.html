<!--  . . . . . . . . . . . . . . . LINK ATTRIBUTES . . . . . . . . . . . . -->

<!-- We can put any content inside anchor tag(images,headings etc all are allowed).
 If the page is inside a directory,we need to make sure that we link to the correct page. -->
 
<!-- When ever <a href="" target="blank "> My FB</a> (target) is used it open in a new web page. --> 


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link_Attributes</title>
</head>
<body>
    
    <headder>

        <nav>      <!-- to  -->
             <a href="/home">Home</a>
             <a href="/about.html">About </a>
            <a href="https://facebook.com/CodeWithHarry" target="_blank "> Code with HArry's FB</a>
            <!-- target="_blank" open up in new page -->
        
        </nav>


    </headder>
</body>
</html>
