<!-- 04: Create a table displaying score of cricket Players in a match using HTML. -->
 

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table displaying score </title>
</head>
<body>
    
<table> 
    <h1>Scores of Players</h1>

    <thead>
       <tr>
          <th>Name</th>
          <th>Score</th>
          <th>Match</th>
       </tr>

    </thead>
    <tbody>
          <tr>
            <td>Virat Kohli</td>
            <td>450</td>
            <td>6</td>
          </tr>

          <tr>
            <td>Mahendra sing Dhoni</td>
            <td>500</td>
            <td>7</td>
          </tr> 
         
          <tr> 
            <td>Shikher Dhawan</td>
            <td>300</td>
            <td>5</td>
          </tr>

          <tr>
            <td>Rohit Sharma</td>
            <td>600</td>
            <td>8</td>
          </tr>

    </tbody>
</table>
</body>
</html>
