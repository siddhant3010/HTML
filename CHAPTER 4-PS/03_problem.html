<!-- 03: Create an HTML form for a travel website to book a vacation. -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>travel website form</title>

    <link rel="stylesheet" href="style.css"> 
    <!-- using css generated using ai for css generation -->
     
 </head>
 <body>
    <form action="">
        <div>
            <label for="name">Name</label>
            <input id="name" type="text" placeholder="Enter your name">
        </div>

        <div>
             <label for="age">AGE</label>
             <input id="age" type="number" placeholder="Enter your age">
        </div>

        <div>
            <label for="phone no">Phone No</label>
            <input id="phone no" type="phone" placeholder="Enter your Phone No">

        </div>
         
        <div>
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="Enter Your Email id">
        </div>

       <div>
        <label for="address">ADDRESS</label>
        <input id="address" type="add" placeholder="Enter Your Address">
       </div> 

       <button type="submit">Submit</button>

    </form>
    
 </body>
 </html>
