<!--  . . . . . .  . . . . . .  . .HTML forms  . . . . . . . .  -->

<!--  an html <form> tag is used to create cells spanning multiple columns. -->

<!-- There are different forms of elements for different kinds of users input.
 - <input>element: can be of type text,checkbox,radio button,submit.
                   we also have a 'file' type.
           
 - <textarea>element:Defines a multiline text input'cols' and 'rows'
                     attributes can be used to size the text area.
                     
 - <select>element: Defines a drop down list.                    -->





<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML_Forms</title>

    <!-- style tag using ai  -->
    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
    
        body{
            background: linear-gradient(to right, #4facfe, #00f2fe);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
    
        form{
            background-color: white;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
    
        h1{
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }
    
        div{
            margin-bottom: 18px;
        }
    
        label{
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #444;
        }
    
        input,
        select,
        textarea{
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            transition: 0.3s;
        }
    
        input:focus,
        select:focus,
        textarea:focus{
            border-color: #4facfe;
            outline: none;
            box-shadow: 0 0 8px rgba(79,172,254,0.5);
        }
    
        textarea{
            resize: none;
        }
    
        p{
            margin-bottom: 10px;
            font-weight: bold;
            color: #444;
        }
    
        input[type="radio"],
        input[type="checkbox"]{
            width: auto;
            margin-right: 8px;
        }
    
        button{
            width: 100%;
            padding: 12px;
            background-color: #4facfe;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
    
        button:hover{
            background-color: #008cdd;
        }
    
    </style>
</head>
<body>

    <h1> Forms in HTML</h1>
    <form action="/submit.php">
    
    
<!-- Name input. -->
     <div> 
        <label for="name">Name</label>
        <input id="name" type="text" placeholder="Enter Name">
                <!-- type="text" onlu allow adition of text -->
    </div>
 
    
<!-- Phone no input. -->
    <div>
        <label for="phone">Phone</label>
        <input id="phone" type="tel" placeholder="Enter Phone">
                <!-- type="tel" allow to write trlrphone no. -->
    </div>


<!-- email input.  -->
    <div> 
        <label for="email">Email</label>
        <input id="namee" type="email" placeholder ="Enter Email">
    </div>
                <!-- type=" email" allow to write onlu valid email address. -->

    
<!-- Password input.  -->
    <div> 
         <label for="password">Password</label>
         <input id="password" type="password" placeholder="Enter Password" required>
                 <!-- type="password" turn your password into symbols not directly visible.-->
    </div>  
    
    
<!-- DAte input. -->
    <div> 
        <label for="DOB">Dob</label>
        <input id="DOB" type="date" required>
                <!-- type="date" helps in adding date selction. -->
    </div>


<!-- Dropdown ( select input ) for Gender. -->
    <div>
    <label for="gender">Gender</label>
    <select id="gender" required>
        <option value=""disabled slected> Select Gender</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="othert">Other</option>
    </select>
    </div>


<!--  Radio buttons for subscription plan  -->
<div>
    <p>Subscription Plan</p>
    <input id="basic" type="radio" name="subscription" value="basic">
    <label for="basic">Basic</label>


    <input id="Premium" type="radio" name="subscription" value="Premium">
    <label for="Premium">Premium</label>


    <input id="Vip" type="radio" name="subscription" value="Vip">
    <label for="Vip">VIP</label>

<!--  if the name value is similar in radio button only one at a time can be selected. -->
</div>


<!-- Checkbox for agreeing to terms. -->
<div>
     <input id="terms" type="checkbox" required>
     <label for="terms">I agree to the terms and conditions</label>
    
</div>


<!-- Text are for comments. -->
 <div>
    <label for="comments" >Comments</label>
    <textarea id="comments" placeholder="Enter your comments." rows="4"></textarea>
 </div>


<!-- Submit button -->
 <div>
    <button type="submit">Submit</button>
 </div>
</form>
  <!-- Form ends here -->

</body>
</html>
