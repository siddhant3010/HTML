<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables_HTMl</title>

<!-- CSS generated using ai -->

<style>
    table {
        width: 100%;
        border-collapse: collapse;
        margin: 20px 0;
        font-family: Arial, sans-serif;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    
    th {
        background-color: #333;
        color: white;
        padding: 12px;
        text-align: left;
    }
    
    td {
        padding: 12px;
        border-bottom: 1px solid #ddd;
        border: 2px solid black;
    }
    
    tr:nth-child(even) {
        background-color: #f2f2f2;
    }
    
    tr:hover {
        background-color: #ddd;
        transition: 0.3s;
    }
    
    table, th, td {
        border: 1px solid #ccc;
    }
    </style>

</head>
<body>

       <h1> Tables in HTML</h1>
       <table>
        <!-- Head of the table -->
        <thead>
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Salary</th>
            </tr>
            
        </thead>

        <!-- Body of the table -->
        <tbody>
            <tr>
                <td>Siddhant</td>
                <td>Software Developer</td>
                <td>$100000</td>
            </tr>

            <tr>
                <td>Aman</td>
                <td>Intern Developer</td>
                <td>$6000</td>
            </tr>

            <tr>
                <td>Anu</td>
                <td>Assistant Developer</td>
                <td>$50000</td>
            </tr>

            <tr>
                <td colspan="1">Thank</td>
                <td colspans="2">You</td>
            </tr>

        </tbody>
       </table>




    
</body>
</html>
